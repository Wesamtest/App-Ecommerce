<section class="popular_product py-16">

    <div class="container">
        <input type="search" class="block w-[80%] mx-auto rounded p-2 my-4 border border-green-800 text-gray-800 focus:outline-non focus:border-blue-500 focus:ring-2 focus:ring-blue-400"  [(ngModel)]="text" placeholder="Serach product list ...">
        <h2 class=" text-gray-800 text-3xl pb-10 ">Product List:</h2>
        <div class="card grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            @for (product of products | paginate: { id: 'foo',itemsPerPage: pageSize,currentPage: p,totalItems: total } | search:text; track product.id) {

                    <app-card [product]="product"/>
                      
            }
            
        </div>
        <div class="flex justify-center mt-6">
            <pagination-controls   id="foo" (pageChange)="getAllProductData($event)">
            </pagination-controls >
        </div>
        
        
        
    </div>
        

</section>
